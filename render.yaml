## Render Deployment Blueprint for DeployX API
## See: https://render.com/docs/blueprint-spec
##
## How to use:
##   1. Push this file to your GitHub repository root.
##   2. Go to https://dashboard.render.com -> "New Blueprint"
##   3. Connect your GitHub repo - Render auto-discovers this file.
##   4. Fill in the environment variable values when prompted.
##
## Architecture:
##   Dashboard  -> Vercel          (apps/dashboard)
##   API        -> Render          (this file)
##   Database   -> Neon / Supabase (external, set DATABASE_URL below)
##   Agent      -> Student PC      (apps/agent - NOT deployed here)

services:
  - type: web
    name: deployx-api
    runtime: node
    region: oregon
    branch: main

    rootDir: .
    buildCommand: >
      corepack enable &&
      corepack prepare pnpm@latest --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter api exec prisma migrate deploy &&
      pnpm --filter api build

    startCommand: node apps/api/dist/main.js

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AGENT_PAIRING_TTL_MS
        value: "600000"
      - key: AGENT_HEARTBEAT_INTERVAL_MS
        value: "15000"
      - key: AGENT_OFFLINE_AFTER_MS
        value: "45000"
      - key: MAX_UPLOAD_SIZE_MB
        value: "100"
      - key: MAX_EXTRACTED_SIZE_MB
        value: "300"
      - key: MAX_ZIP_FILES
        value: "10000"
      - key: MAX_ZIP_DEPTH
        value: "15"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_DEFAULT_MAX
        value: "120"
      - key: RATE_LIMIT_AUTH_MAX
        value: "30"
      - key: RATE_LIMIT_PAIR_MAX
        value: "15"
      - key: RATE_LIMIT_DEPLOY_MAX
        value: "40"

    autoDeploy: true
    plan: free
